name: Auto URL Submitter

on:
  push:
    paths:
      - 'pdf_urls.txt'
  schedule:
    - cron: '*/5 * * * *'   # 🔁 testing (later change to 0 */2 * * *)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # 📥 Repo checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 🐍 Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🌐 Install Chrome (stable way)
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install selenium

      # 🔁 Run script with retry
      - name: Run automation (with retry)
        env:
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
        run: |
          for i in 1 2 3
          do
            echo "🔁 Attempt $i..."
            python auto_submit.py && break
            echo "❌ Attempt $i failed. Retrying in 20s..."
            sleep 20
          done

      # 📤 Upload logs always
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: |
            automation.log
            *.png

      # 🧠 Optional: Commit updated logs/status
      - name: Commit logs (optional)
        if: always()
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"

          git add automation.log || true
          git commit -m "Update logs [auto]" || echo "No changes"
          git push || echo "Nothing to push"
